# Deploy alternativo no Fly.io: rode `fly launch` dentro de backend/
app = "rotaspeed-prime-api"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
